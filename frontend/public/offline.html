<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1a2b" />
    <title>Offline — Engine Room Academy</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f111a;
        color: #e7e9f0;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        color: #c7d3ea;
      }
      p {
        margin: 0;
        color: #8b93a7;
        max-width: 28rem;
        line-height: 1.5;
      }
      button {
        margin-top: 1.25rem;
        border: 0;
        border-radius: 10px;
        padding: 0.65rem 1.1rem;
        background: #f5a623;
        color: #0b1a2b;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Engine Room Academy can't reach the server right now. Check your connection
        and try again — previously opened pages may still be available from cache.
      </p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
