# Nginx for engineroomacademy.org — serves the React SPA, reverse-proxies /api to the
# Flask backend, and terminates HTTPS with the Let's Encrypt certificate.
#
# The certificate is issued/renewed by Certbot via the HTTP-01 webroot challenge
# (see init-letsencrypt.sh). Until the first certificate exists, init-letsencrypt.sh
# stages a temporary self-signed one so nginx can start.

# ── HTTP :80 — ACME challenge + redirect everything else to HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name engineroomacademy.org www.engineroomacademy.org;

    # Let's Encrypt HTTP-01 challenge files (served directly, never redirected).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS :443 — the application ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name engineroomacademy.org www.engineroomacademy.org;

    ssl_certificate     /etc/letsencrypt/live/engineroomacademy.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/engineroomacademy.org/privkey.pem;
    # Recommended TLS settings (fetched into ./certbot/conf by init-letsencrypt.sh).
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS — tell browsers to stick to HTTPS (enable once you're confident TLS is stable).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ── API → Flask backend (gunicorn on the "backend" service) ──
    # No trailing slash on proxy_pass so the full "/api/..." path reaches Flask.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 25M;   # matches backend MAX_CONTENT_LENGTH (PDF/sketch uploads)
    }

    # ── Static SPA ──
    root  /usr/share/nginx/html;
    index index.html;

    # Long-cache the hashed Vite build assets.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html references the content-hashed /assets/ bundle, so it must
    # never be cached — otherwise a browser (or any CDN in front of this)
    # can keep serving a stale page pointing at an old bundle indefinitely
    # after a deploy, with no way to tell short of a hard refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: fall back to index.html for any non-file path.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
