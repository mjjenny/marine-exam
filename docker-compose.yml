services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: marine
      POSTGRES_PASSWORD: marine
      POSTGRES_DB: marine_exam
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marine -d marine_exam"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: stands in for DigitalOcean Spaces locally (S3-compatible).
  # Start explicitly with `docker compose --profile storage up -d`.
  minio:
    image: minio/minio
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data
