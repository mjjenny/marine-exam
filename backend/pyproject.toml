[project]
name = "marine-exam-backend"
version = "0.1.0"
description = "Flask + Postgres backend for the Marine Engineer exam-prep platform"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "SQLAlchemy>=2.0",
    "Flask-SQLAlchemy>=3.1",
    "Flask-Migrate>=4.0",
    "psycopg2-binary>=2.9",
    "bcrypt>=4.1",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "pdfplumber>=0.11",   # admin "parse exam PDF" endpoint (runtime)
    "pymupdf>=1.24",      # EK Oral PDF importer (flask import-orals)
    "gunicorn>=21.2",     # production WSGI server
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
